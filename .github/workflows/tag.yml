name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
concurrency:
  group: ${{ github.workflow }}
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Validate tag major matches go.mod module
        run: ./.github/scripts/validate-tag-major.sh
      - name: Release (Goreleaser)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
  build_docker:
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        run: |
          REF_NO_HEAD_V=${GITHUB_REF_NAME#v}
          IMAGE=ghcr.io/${{ github.repository }}:${REF_NO_HEAD_V}-${{ matrix.arch }}
          make build IMAGE="$IMAGE" \
            VERSION="$REF_NO_HEAD_V" \
            COMMIT="${GITHUB_SHA}" \
            DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker run --rm "$IMAGE" --version
          docker push "$IMAGE"
  manifest:
    needs: build_docker
    runs-on: ubuntu-26.04
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          REF_NO_HEAD_V=${GITHUB_REF_NAME#v}
          IMAGE=ghcr.io/${{ github.repository }}
          TAG_ARGS=(-t "${IMAGE}:${REF_NO_HEAD_V}")
          if [[ "$GITHUB_REF_NAME" != *-rc* ]]; then
            TAG_ARGS+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${IMAGE}:${REF_NO_HEAD_V}-amd64" \
            "${IMAGE}:${REF_NO_HEAD_V}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${REF_NO_HEAD_V}"
